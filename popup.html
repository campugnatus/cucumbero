<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>cucumbero</title>
  </head>
  <body>
    <header>
      <!-- The icon rather than the 🥒 character: an emoji is drawn by whichever
           font the OS supplies, so Windows showed a different cucumber from the
           one in the toolbar. This is the same artwork the icons are cut from. -->
      <img class="logo" src="icons/cucumber.png" alt="" />
      <span class="wordmark">cucumbero</span>
    </header>

    <!-- ------------------------------------------------------- idle ---- -->
    <section id="view-idle" class="view">
      <div class="stepper">
        <button id="minus" title="15 minutes less (DOWN arrow)" class="step" type="button" aria-label="15 minutes less">−</button>
        <label class="amount">
          <input
            id="minutes"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            spellcheck="false"
            aria-label="Minutes"
            value="45"
            autofocus
          />
          <span class="unit">min</span>
        </label>
        <button id="plus" title="15 minutes more (UP arrow)" class="step" type="button" aria-label="15 minutes more">+</button>
      </div>
      <button id="go" class="primary" type="button">Start session</button>
    </section>

    <!-- ----------------------------------------------------- active ---- -->
    <section id="view-active" class="view" hidden>
      <div class="clock" id="clock">--:--</div>
      <button id="stop-hold" class="hold" type="button">
        <span class="fill"></span>
        <span class="label-text">hold to abort the session</span>
      </button>
    </section>

    <section id="section-blocklist">

      <!-- ------------------------------------------------------ list ----- -->
      <button id="list-toggle" class="disclosure" type="button" aria-expanded="false">
        <span class="caret">▸</span>
        <span>Blocklist</span>
        <span class="count" id="list-count">0</span>
      </button>
      <!-- #list-wrap is the card, not the ul: with the border on the list, an
           empty blocklist rendered as an empty box with the message under it. -->
      <div id="list-wrap" hidden>
        <ul id="list"></ul>
        <p class="hint" id="list-empty" hidden>Your blocklist is empty</p>
      </div>
      <!-- ------------------------------------------------------- add ----- -->
      <div class="row add">
        <!-- Labelled explicitly: a placeholder isn't a label, and it vanishes
             the moment you type, so without this the field is announced as an
             unnamed text box. -->
        <input
          id="site-input"
          type="text"
          spellcheck="false"
          autocomplete="off"
          aria-label="Site to block"
          placeholder="example.com"
        />
        <button id="add" class="secondary" type="button">Block</button>
      </div>
    </section>

    <!-- Its own section: errors come from the duration and Go path as much as
         from the blocklist. role=status gets them announced rather than just
         appearing. -->
    <div class="status" id="status" role="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
